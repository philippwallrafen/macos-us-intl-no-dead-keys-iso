name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate keyboard layout
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="US Intl no dead keys ISO.bundle"
          INFO="$BUNDLE/Contents/Info.plist"
          KEYLAYOUT="$BUNDLE/Contents/Resources/US Intl no dead keys ISO.keylayout"

          test -d "$BUNDLE"
          test -f "$INFO"
          test -f "$KEYLAYOUT"

          plutil -lint "$INFO"
          xmllint --noout "$KEYLAYOUT"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO")" = "US Intl no dead keys ISO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "1"

          grep -q 'name="US Intl no dead keys ISO"' "$KEYLAYOUT"

          COUNT="$(find "$BUNDLE/Contents/Resources" -maxdepth 1 -name '*.keylayout' | wc -l | tr -d ' ')"
          test "$COUNT" = "1"
