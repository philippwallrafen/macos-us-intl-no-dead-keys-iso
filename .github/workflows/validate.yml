name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate keyboard layout
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="US Intl no dead keys ISO.bundle"
          INFO="$BUNDLE/Contents/Info.plist"
          VERSION="$BUNDLE/Contents/version.plist"
          RES="$BUNDLE/Contents/Resources"
          KEYLAYOUT="$RES/US Intl no dead keys ISO.keylayout"
          ICON="$RES/US Intl no dead keys ISO.icns"
          STRINGS="$RES/en.lproj/InfoPlist.strings"

          test -d "$BUNDLE"
          test -f "$INFO"
          test -f "$VERSION"
          test -f "$KEYLAYOUT"
          test -f "$ICON"
          test -f "$STRINGS"

          plutil -lint "$INFO"
          plutil -lint "$VERSION"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO")" = "US Intl no dead keys ISO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "1.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "1"

          test "$(/usr/libexec/PlistBuddy -c 'Print :ProjectName' "$VERSION")" = "US Intl no dead keys ISO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BuildVersion' "$VERSION")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SourceVersion' "$VERSION")" = "1.0.0"

          grep -q 'name="US Intl no dead keys ISO"' "$KEYLAYOUT"
          grep -q 'US Intl no dead keys ISO' "$STRINGS"

          COUNT="$(find "$RES" -maxdepth 1 -name '*.keylayout' | wc -l | tr -d ' ')"
          test "$COUNT" = "1"

          python3 <<'PY'
          import re
          from pathlib import Path

          src = Path(
              "US Intl no dead keys ISO.bundle/Contents/Resources/"
              "US Intl no dead keys ISO.keylayout"
          ).read_text()

          if '<?xml version="1.1"' not in src:
              raise SystemExit("Expected XML 1.1 keyboard layout")

          src = src.replace(
              '<?xml version="1.1"',
              '<?xml version="1.0"',
              1,
          )

          src = re.sub(
              r'&#x(?:000[1-8BCEF]|001[0-9A-F]);',
              'x',
              src,
              flags=re.IGNORECASE,
          )

          Path("/tmp/keylayout-validation.xml").write_text(src)
          PY

          xmllint --noout /tmp/keylayout-validation.xml
